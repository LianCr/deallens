name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: First-load JS budget (≤220 KB gzip per route)
        run: npm run check:js-budget
      - name: Upload build for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A hung browser must fail fast, not hold a runner for the 6 h default
    # (seen 2026-11-18: a WebKit run stuck > 30 min on this PR).
    timeout-minutes: 20
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --grep-invert @a11y
      - name: Accessibility gate (axe-core, WCAG 2.1 AA, light + dark + mobile)
        if: matrix.browser == 'chromium'
        run: npx playwright test --project=chromium --grep @a11y
      - name: E2E with JavaScript disabled (isomorphic guarantee)
        if: matrix.browser == 'chromium'
        run: npx playwright test --project=chromium-no-js

  lighthouse:
    name: Lighthouse budget gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - name: Run Lighthouse CI against production server
        run: npx lhci autorun
